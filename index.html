<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ретро Понг</title>
    <style>
        body {
            background-color: #121216;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 15px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 5px;
            font-size: 24px;
        }
        p {
            color: #a4b0be;
            margin: 5px 0 10px 0;
            font-size: 13px;
        }
        .score-box {
            font-size: 22px;
            color: #2ed573;
            font-weight: bold;
            margin-bottom: 10px;
        }
        canvas {
            background-color: #1e1e24;
            display: block;
            margin: 0 auto;
            border: 3px solid #ff4757;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        /* Кнопки управления для телефона */
        .control-pad {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 15px;
        }
        .ctrl-btn {
            background-color: #2f3542;
            color: white;
            border: 2px solid #57606f;
            width: 90px;
            height: 55px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }
        .ctrl-btn:active {
            background-color: #ff4757;
            border-color: #ff4757;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🏓 Ретро Понг by moonx</h1>
    <p>Отбивай мяч ракеткой и не пропускай голы!</p>

    <div class="score-box"><span id="playerScore">0</span> : <span id="botScore">0</span></div>

    <canvas id="pongCanvas" width="320" height="400"></canvas>

    <!-- Кнопки для телефона -->
    <div class="control-pad">
        <button class="ctrl-btn" ontouchstart="movePlayer(-25)" onclick="movePlayer(-25)">▲ Вверх</button>
        <button class="ctrl-btn" ontouchstart="movePlayer(25)" onclick="movePlayer(25)">▼ Вниз</button>
    </div>

    <br>
    <button class="btn" onclick="resetGame()">Заново</button>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        let ball = { x: 160, y: 200, radius: 8, speed: 4, velocityX: 4, velocityY: 3 };
        let player = { x: 130, y: 360, width: 60, height: 10, score: 0 };
        let bot = { x: 130, y: 30, width: 60, height: 10, score: 0 };

        function movePlayer(step) {
            player.x += step;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }

        // Управление с клавиатуры ПК
        document.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft" || e.key === "a") movePlayer(-25);
            else if (e.key === "ArrowRight" || e.key === "d") movePlayer(25);
        });

        function collision(b, p) {
            return b.x + b.radius > p.x && b.x - b.radius < p.x + p.width &&
                   b.y + b.radius > p.y && b.y - b.radius < p.y + p.height;
        }

        function update() {
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Искусственный интеллект бота
            let botCenter = bot.x + bot.width / 2;
            if (botCenter < ball.x - 15) bot.x += 3.2;
            else if (botCenter > ball.x + 15) bot.x -= 3.2;

            if (bot.x < 0) bot.x = 0;
            if (bot.x + bot.width > canvas.width) bot.x = canvas.width - bot.width;

            // Отскок от стен
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.velocityX = -ball.velocityX;
            }

            // Столкновение с ракетками
            let activePaddle = (ball.y < canvas.height / 2) ? bot : player;
            if (collision(ball, activePaddle)) {
                let collidePoint = ball.y - (activePaddle.y + activePaddle.height / 2);
                collidePoint = collidePoint / (activePaddle.height / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.y < canvas.height / 2) ? 1 : -1;

                ball.velocityX = ball.speed * Math.sin(angleRad);
                ball.velocityY = direction * ball.speed * Math.cos(angleRad);
                ball.speed += 0.2; // Ускорение мяча
            }

            // Голы
            if (ball.y - ball.radius < 0) {
                player.score++;
                document.getElementById("playerScore").innerText = player.score;
                resetBall();
            } else if (ball.y + ball.radius > canvas.height) {
                bot.score++;
                document.getElementById("botScore").innerText = bot.score;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 4;
            ball.velocityY = -ball.velocityY;
        }

        function resetGame() {
            player.score = 0;
            bot.score = 0;
            document.getElementById("playerScore").innerText = 0;
            document.getElementById("botScore").innerText = 0;
            resetBall();
        }

        function render() {
            ctx.fillStyle = "#1e1e24";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Разделительная линия
            ctx.strokeStyle = "#4b4b56";
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // Ракетки и мяч
            ctx.fillStyle = "#ff4757";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = "#2ed573";
            ctx.fillRect(bot.x, bot.y, bot.width, bot.height);

            ctx.fillStyle = "#ffa502";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            render();
        }

        setInterval(gameLoop, 1000 / 60);
    </script>
</body>
</html>
